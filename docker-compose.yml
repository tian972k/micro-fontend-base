version: "3.8"

services:
  shell:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
    ports:
      - "8000:3000"
    environment:
      - NODE_ENV=production
      # Optional: Override MFE URLs for cloud deployment
      # - MFE_APP_REACT_PUBLIC_URL=https://app-react.example.com
      # - MFE_APP_NEXTJS_PUBLIC_URL=https://app-nextjs.example.com
    depends_on:
      - app-react
      - app-nextjs
      - app-vue
      - app-svelte
      - app-solidjs

  app-react:
    build:
      context: .
      dockerfile: Dockerfile.mfe
      args:
        APP_NAME: app-react
    ports:
      - "8001:80"

  app-nextjs:
    build:
      context: .
      dockerfile: Dockerfile.mfe
      args:
        APP_NAME: app-nextjs
        BUILD_OUTPUT_DIR: public
    ports:
      - "8002:80"

  app-vue:
    build:
      context: .
      dockerfile: Dockerfile.mfe
      args:
        APP_NAME: app-vue
    ports:
      - "8003:80"

  app-svelte:
    build:
      context: .
      dockerfile: Dockerfile.mfe
      args:
        APP_NAME: app-svelte
    ports:
      - "8004:80"

  app-solidjs:
    build:
      context: .
      dockerfile: Dockerfile.mfe
      args:
        APP_NAME: app-solidjs
    ports:
      - "8005:80"
