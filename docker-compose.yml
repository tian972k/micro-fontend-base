version: "3.8"

services:
  shell:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
    ports:
      - "8000:3000"
    environment:
      - NODE_ENV=production
      # Required: signs the session cookie (openssl rand -base64 32).
      # Put it in a .env file next to this one or export it before `up`.
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET, e.g. openssl rand -base64 32}
      # Login account until verifyCredentials() is wired to your identity
      # provider. Nothing can sign in while these are empty.
      - AUTH_DEMO_EMAIL=${AUTH_DEMO_EMAIL:-}
      - AUTH_DEMO_PASSWORD=${AUTH_DEMO_PASSWORD:-}
      # Optional: public URL of an MFE when it isn't http://localhost:<port>
      # - MFE_URL_APP_REACT=https://app-react.example.com
    depends_on:
      - app-react
      - app-nextjs
      - app-vue
      - app-svelte
      - app-solidjs

  app-react:
    build:
      context: .
      dockerfile: Dockerfile.mfe
      args:
        APP_NAME: app-react
    ports:
      - "8001:80"

  app-nextjs:
    build:
      context: .
      dockerfile: Dockerfile.mfe
      args:
        APP_NAME: app-nextjs
        BUILD_OUTPUT_DIR: public
    ports:
      - "8002:80"

  app-vue:
    build:
      context: .
      dockerfile: Dockerfile.mfe
      args:
        APP_NAME: app-vue
    ports:
      - "8003:80"

  app-svelte:
    build:
      context: .
      dockerfile: Dockerfile.mfe
      args:
        APP_NAME: app-svelte
    ports:
      - "8004:80"

  app-solidjs:
    build:
      context: .
      dockerfile: Dockerfile.mfe
      args:
        APP_NAME: app-solidjs
    ports:
      - "8005:80"
