version: 2
updates:
  # npm/pnpm workspace dependencies. Minor and patch updates are grouped so
  # they arrive as one weekly PR; majors come one PR each.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
