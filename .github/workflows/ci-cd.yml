name: CI/CD Pipeline (Orchestrator)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_ONLY: ${{ vars.TURBO_REMOTE_ONLY || 'false' }}

jobs:
  check-secrets:
    name: Check Secrets
    runs-on: ubuntu-latest
    outputs:
      has_docker_secrets: ${{ steps.docker.outputs.has_secrets }}
      has_vercel_secrets: ${{ steps.vercel.outputs.has_secrets }}
      has_project_id_shell: ${{ steps.project_ids.outputs.shell_id_set }}
      has_project_id_app_react: ${{ steps.project_ids.outputs.app_react_id_set }}
      has_project_id_app_nextjs: ${{ steps.project_ids.outputs.app_nextjs_id_set }}
      has_project_id_app_vue: ${{ steps.project_ids.outputs.app_vue_id_set }}
      has_project_id_app_svelte: ${{ steps.project_ids.outputs.app_svelte_id_set }}
      has_project_id_app_solidjs: ${{ steps.project_ids.outputs.app_solidjs_id_set }}
    steps:
      - name: Check Docker secrets
        id: docker
        run: |
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi
      - name: Check Vercel secrets
        id: vercel
        run: |
          if [[ -n "${{ secrets.VERCEL_TOKEN }}" && -n "${{ secrets.VERCEL_ORG_ID }}" ]]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi
      - name: Check Vercel project ids
        id: project_ids
        env:
          SHELL_ID: ${{ secrets.VERCEL_PROJECT_ID_SHELL }}
          APP_REACT_ID: ${{ secrets.VERCEL_PROJECT_ID_REACT }}
          APP_NEXTJS_ID: ${{ secrets.VERCEL_PROJECT_ID_NEXTJS }}
          APP_VUE_ID: ${{ secrets.VERCEL_PROJECT_ID_VUE }}
          APP_SVELTE_ID: ${{ secrets.VERCEL_PROJECT_ID_SVELTE }}
          APP_SOLIDJS_ID: ${{ secrets.VERCEL_PROJECT_ID_SOLIDJS }}
        run: |
          [[ -n "$SHELL_ID" ]] && echo "shell_id_set=true" >> $GITHUB_OUTPUT || echo "shell_id_set=false" >> $GITHUB_OUTPUT
          [[ -n "$APP_REACT_ID" ]] && echo "app_react_id_set=true" >> $GITHUB_OUTPUT || echo "app_react_id_set=false" >> $GITHUB_OUTPUT
          [[ -n "$APP_NEXTJS_ID" ]] && echo "app_nextjs_id_set=true" >> $GITHUB_OUTPUT || echo "app_nextjs_id_set=false" >> $GITHUB_OUTPUT
          [[ -n "$APP_VUE_ID" ]] && echo "app_vue_id_set=true" >> $GITHUB_OUTPUT || echo "app_vue_id_set=false" >> $GITHUB_OUTPUT
          [[ -n "$APP_SVELTE_ID" ]] && echo "app_svelte_id_set=true" >> $GITHUB_OUTPUT || echo "app_svelte_id_set=false" >> $GITHUB_OUTPUT
          [[ -n "$APP_SOLIDJS_ID" ]] && echo "app_solidjs_id_set=true" >> $GITHUB_OUTPUT || echo "app_solidjs_id_set=false" >> $GITHUB_OUTPUT

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      packages_changed: ${{ steps.changes.outputs.packages }}
      root_config_changed: ${{ steps.changes.outputs.root_config }}
      shell_changed: ${{ steps.changes.outputs.shell }}
      app_react_changed: ${{ steps.changes.outputs.app_react }}
      app_nextjs_changed: ${{ steps.changes.outputs.app_nextjs }}
      app_vue_changed: ${{ steps.changes.outputs.app_vue }}
      app_svelte_changed: ${{ steps.changes.outputs.app_svelte }}
      app_solidjs_changed: ${{ steps.changes.outputs.app_solidjs }}
      any_changed: ${{ steps.changes.outputs.any }}
      needs_full_rebuild: ${{ steps.set-full-rebuild.outputs.needs_full_rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for file changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            packages:
              - 'packages/**'
            root_config:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
            shell:
              - 'apps/shell/**'
            app_react:
              - 'apps/app-react/**'
            app_nextjs:
              - 'apps/app-nextjs/**'
            app_vue:
              - 'apps/app-vue/**'
            app_svelte:
              - 'apps/app-svelte/**'
            app_solidjs:
              - 'apps/app-solidjs/**'
            any:
              - 'apps/**'
              - 'packages/**'
      - name: Determine if full rebuild needed
        id: set-full-rebuild
        run: |
          if [[ "${{ steps.changes.outputs.packages }}" == "true" ]] || [[ "${{ steps.changes.outputs.root_config }}" == "true" ]]; then
            echo "needs_full_rebuild=true" >> $GITHUB_OUTPUT
          else
            echo "needs_full_rebuild=false" >> $GITHUB_OUTPUT
          fi

  lint:
    needs: detect-changes
    uses: ./.github/workflows/reusable-lint.yml
    with:
      needs_run: ${{ needs.detect-changes.outputs.any_changed == 'true' || needs.detect-changes.outputs.root_config_changed == 'true' }}
    secrets: inherit

  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [detect-changes, lint]
    if: |
      needs.detect-changes.outputs.packages_changed == 'true' || 
      needs.detect-changes.outputs.root_config_changed == 'true' ||
      needs.detect-changes.outputs.shell_changed == 'true' ||
      needs.detect-changes.outputs.app_react_changed == 'true' ||
      needs.detect-changes.outputs.app_nextjs_changed == 'true' ||
      needs.detect-changes.outputs.app_vue_changed == 'true' ||
      needs.detect-changes.outputs.app_svelte_changed == 'true' ||
      needs.detect-changes.outputs.app_solidjs_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      
      - name: Check Turbo remote cache availability
        id: turbo-env
        run: |
          if [[ -n "${{ secrets.TURBO_TOKEN }}" && -n "${{ vars.TURBO_TEAM }}" ]]; then
            echo "has_remote_cache=true" >> $GITHUB_OUTPUT
          else
            echo "has_remote_cache=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache Turbo (local fallback)
        if: steps.turbo-env.outputs.has_remote_cache == 'false'
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-packages-${{ runner.os }}-${{ hashFiles('packages/**/src/**', 'packages/**/package.json') }}
          restore-keys: |
            turbo-packages-${{ runner.os }}-

      - name: Build packages (with Turbo remote cache)
        if: steps.turbo-env.outputs.has_remote_cache == 'true'
        run: pnpm turbo run build --filter='./packages/*'
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Build packages (local cache only)
        if: steps.turbo-env.outputs.has_remote_cache == 'false'
        run: pnpm turbo run build --filter='./packages/*'

      - uses: actions/upload-artifact@v4
        with:
          name: packages-build
          path: |
            packages/*/dist
            packages/*/build
          retention-days: 1

  build-shell:
    needs: [detect-changes, lint, build-packages, check-secrets]
    if: |
      always() &&
      (needs.lint.result == 'success') &&
      (needs.build-packages.result == 'success') &&
      (needs.detect-changes.outputs.shell_changed == 'true' || needs.detect-changes.outputs.needs_full_rebuild == 'true') &&
      needs.check-secrets.outputs.has_project_id_shell == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      app: shell
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SHELL }}

  build-app-react:
    needs: [detect-changes, lint, build-packages, check-secrets]
    if: |
      always() &&
      (needs.lint.result == 'success') &&
      (needs.build-packages.result == 'success') &&
      (needs.detect-changes.outputs.app_react_changed == 'true' || needs.detect-changes.outputs.needs_full_rebuild == 'true') &&
      needs.check-secrets.outputs.has_project_id_app_react == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      app: app-react
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_REACT }}

  build-app-nextjs:
    needs: [detect-changes, lint, build-packages, check-secrets]
    if: |
      always() &&
      (needs.lint.result == 'success') &&
      (needs.build-packages.result == 'success') &&
      (needs.detect-changes.outputs.app_nextjs_changed == 'true' || needs.detect-changes.outputs.needs_full_rebuild == 'true') &&
      needs.check-secrets.outputs.has_project_id_app_nextjs == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      app: app-nextjs
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_NEXTJS }}

  build-app-vue:
    needs: [detect-changes, lint, build-packages, check-secrets]
    if: |
      always() &&
      (needs.lint.result == 'success') &&
      (needs.build-packages.result == 'success') &&
      (needs.detect-changes.outputs.app_vue_changed == 'true' || needs.detect-changes.outputs.needs_full_rebuild == 'true') &&
      needs.check-secrets.outputs.has_project_id_app_vue == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      app: app-vue
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_VUE }}

  build-app-svelte:
    needs: [detect-changes, lint, build-packages, check-secrets]
    if: |
      always() &&
      (needs.lint.result == 'success') &&
      (needs.build-packages.result == 'success') &&
      (needs.detect-changes.outputs.app_svelte_changed == 'true' || needs.detect-changes.outputs.needs_full_rebuild == 'true') &&
      needs.check-secrets.outputs.has_project_id_app_svelte == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      app: app-svelte
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SVELTE }}

  build-app-solidjs:
    needs: [detect-changes, lint, build-packages, check-secrets]
    if: |
      always() &&
      (needs.lint.result == 'success') &&
      (needs.build-packages.result == 'success') &&
      (needs.detect-changes.outputs.app_solidjs_changed == 'true' || needs.detect-changes.outputs.needs_full_rebuild == 'true') &&
      needs.check-secrets.outputs.has_project_id_app_solidjs == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      app: app-solidjs
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SOLIDJS }}

  deploy-shell:
    needs: [check-secrets, detect-changes]
    if: |
      (needs.detect-changes.outputs.shell_changed == 'true' || needs.detect-changes.outputs.needs_full_rebuild == 'true') &&
      needs.check-secrets.outputs.has_vercel_secrets == 'true' &&
      needs.check-secrets.outputs.has_project_id_shell == 'true'
    uses: ./.github/workflows/reusable-deploy-vercel-ssr.yml
    with:
      app: shell
      vercel_has_secrets: ${{ needs.check-secrets.outputs.has_vercel_secrets == 'true' }}
      vercel_has_project_id: ${{ needs.check-secrets.outputs.has_project_id_shell == 'true' }}
      is_production: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SHELL }}

  deploy-app-react:
    needs: [check-secrets, build-app-react]
    if: |
      needs.build-app-react.result == 'success' &&
      needs.check-secrets.outputs.has_vercel_secrets == 'true' &&
      needs.check-secrets.outputs.has_project_id_app_react == 'true'
    uses: ./.github/workflows/reusable-deploy-vercel.yml
    with:
      app: app-react
      vercel_has_secrets: ${{ needs.check-secrets.outputs.has_vercel_secrets == 'true' }}
      vercel_has_project_id: ${{ needs.check-secrets.outputs.has_project_id_app_react == 'true' }}
      is_production: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_REACT }}

  deploy-app-nextjs:
    needs: [check-secrets, detect-changes]
    if: |
      (needs.detect-changes.outputs.app_nextjs_changed == 'true' || needs.detect-changes.outputs.needs_full_rebuild == 'true') &&
      needs.check-secrets.outputs.has_vercel_secrets == 'true' &&
      needs.check-secrets.outputs.has_project_id_app_nextjs == 'true'
    uses: ./.github/workflows/reusable-deploy-vercel-ssr.yml
    with:
      app: app-nextjs
      vercel_has_secrets: ${{ needs.check-secrets.outputs.has_vercel_secrets == 'true' }}
      vercel_has_project_id: ${{ needs.check-secrets.outputs.has_project_id_app_nextjs == 'true' }}
      is_production: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_NEXTJS }}

  deploy-app-vue:
    needs: [check-secrets, build-app-vue]
    if: |
      needs.build-app-vue.result == 'success' &&
      needs.check-secrets.outputs.has_vercel_secrets == 'true' &&
      needs.check-secrets.outputs.has_project_id_app_vue == 'true'
    uses: ./.github/workflows/reusable-deploy-vercel.yml
    with:
      app: app-vue
      vercel_has_secrets: ${{ needs.check-secrets.outputs.has_vercel_secrets == 'true' }}
      vercel_has_project_id: ${{ needs.check-secrets.outputs.has_project_id_app_vue == 'true' }}
      is_production: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_VUE }}

  deploy-app-svelte:
    needs: [check-secrets, build-app-svelte]
    if: |
      needs.build-app-svelte.result == 'success' &&
      needs.check-secrets.outputs.has_vercel_secrets == 'true' &&
      needs.check-secrets.outputs.has_project_id_app_svelte == 'true'
    uses: ./.github/workflows/reusable-deploy-vercel.yml
    with:
      app: app-svelte
      vercel_has_secrets: ${{ needs.check-secrets.outputs.has_vercel_secrets == 'true' }}
      vercel_has_project_id: ${{ needs.check-secrets.outputs.has_project_id_app_svelte == 'true' }}
      is_production: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SVELTE }}

  deploy-app-solidjs:
    needs: [check-secrets, build-app-solidjs]
    if: |
      needs.build-app-solidjs.result == 'success' &&
      needs.check-secrets.outputs.has_vercel_secrets == 'true' &&
      needs.check-secrets.outputs.has_project_id_app_solidjs == 'true'
    uses: ./.github/workflows/reusable-deploy-vercel.yml
    with:
      app: app-solidjs
      vercel_has_secrets: ${{ needs.check-secrets.outputs.has_vercel_secrets == 'true' }}
      vercel_has_project_id: ${{ needs.check-secrets.outputs.has_project_id_app_solidjs == 'true' }}
      is_production: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SOLIDJS }}

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - lint
      - build-packages
      - build-shell
      - build-app-react
      - build-app-nextjs
      - build-app-vue
      - build-app-svelte
      - build-app-solidjs
      - deploy-shell
      - deploy-app-react
      - deploy-app-nextjs
      - deploy-app-vue
      - deploy-app-svelte
      - deploy-app-solidjs
    if: always()
    steps:
      - run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Packages | ${{ needs.detect-changes.outputs.packages_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shell | ${{ needs.detect-changes.outputs.shell_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| App React | ${{ needs.detect-changes.outputs.app_react_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| App Next.js | ${{ needs.detect-changes.outputs.app_nextjs_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| App Vue | ${{ needs.detect-changes.outputs.app_vue_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| App Svelte | ${{ needs.detect-changes.outputs.app_svelte_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| App SolidJS | ${{ needs.detect-changes.outputs.app_solidjs_changed }} |" >> $GITHUB_STEP_SUMMARY
