name: Reusable Build Apps

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
        description: 'App name (shell, app-react, app-nextjs, app-vue, app-svelte, app-solidjs)'
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false

jobs:
  build:
    name: Build ${{ inputs.app }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download packages build
        uses: actions/download-artifact@v4
        with:
          name: packages-build
          path: packages

      - name: Install Vercel CLI
        run: |
          npm install -g vercel@latest
          # Install pnpm globally so Vercel subprocess can find it
          npm install -g pnpm@9

      - name: Pull Vercel Environment
        working-directory: apps/${{ inputs.app }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Build with Vercel
        working-directory: apps/${{ inputs.app }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Ensure pnpm is available globally
          which pnpm || npm install -g pnpm@9
          vercel build --token=$VERCEL_TOKEN

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-build
          path: |
            apps/${{ inputs.app }}/.vercel/output
          retention-days: 1
