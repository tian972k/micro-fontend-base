name: Reusable Lint & Type Check

on:
  workflow_call:
    inputs:
      needs_run:
        required: true
        type: boolean
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    if: ${{ inputs.needs_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (affected only)
        run: pnpm turbo run lint --affected

      - name: Type check (affected only)
        run: pnpm turbo run type-check --affected

      - name: Unit tests (affected only)
        run: pnpm turbo run test --affected

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    if: ${{ inputs.needs_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # App vite configs import @repo/config's built output (dist/vite.js).
      - name: Build workspace packages
        run: pnpm build:packages

      - name: Generate dev manifests
        run: node scripts/generate-dev-manifest.mjs

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    if: ${{ inputs.needs_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shell (production)
        run: pnpm turbo run build --filter=shell

      # Scores /login and /dashboard on the production build. Budgets live
      # in lighthouserc.cjs; reports are uploaded to temporary public
      # storage (links in the log) and kept as an artifact.
      - name: Run Lighthouse CI
        env:
          SESSION_SECRET: lhci-session-secret
        run: pnpm lhci

      - name: Upload Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14
