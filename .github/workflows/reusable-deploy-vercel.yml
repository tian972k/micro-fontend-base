name: Reusable Deploy Vercel

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
        description: 'App name'
      vercel_has_secrets:
        required: true
        type: boolean
      vercel_has_project_id:
        required: true
        type: boolean
      is_production:
        required: false
        type: boolean
        default: false
        description: 'Deploy to production (true) or preview (false)'
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: false

jobs:
  deploy:
    name: Deploy ${{ inputs.app }} to Vercel (${{ inputs.is_production && 'production' || 'preview' }})
    runs-on: ubuntu-latest
    if: ${{ inputs.vercel_has_secrets && inputs.vercel_has_project_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Download app build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app }}-build
          # upload-artifact flattens a single upload path down to that
          # directory's contents (its "least common ancestor"), so what
          # was uploaded from apps/${app}/.vercel/output needs to be
          # downloaded back into that same directory to reconstruct it.
          path: apps/${{ inputs.app }}/.vercel/output

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        working-directory: apps/${{ inputs.app }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ inputs.is_production }}" == "true" ]; then
            vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          else
            vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          fi

      - name: Deploy to Vercel
        working-directory: apps/${{ inputs.app }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ inputs.is_production }}" == "true" ]; then
            vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          else
            vercel deploy --prebuilt --token=$VERCEL_TOKEN
          fi
